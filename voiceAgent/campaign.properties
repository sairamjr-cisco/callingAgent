# Calling Agent Campaign Settings
# Values are loaded dynamically from this file on the server.

# Run the Excel-to-JSON converter script dynamically on campaign launch (true/false)
run_excel_converter=true

# Delay between successive calls (seconds)
call_delay=5

# Number of claims to process per call batch for the same provider NPI
batch_size=5

# Agent's Text-To-Speech voice (e.g., Polly.Joanna, Polly.Matthew, Polly.Amy, alice)
agent_voice=Polly.Matthew

# The active IVR Payer Profile in ivr.json (e.g., aetna_representative, united_health_care, icici_lombard)
payer_profile=aetna_representative

# Call Recording & Transcription settings
enable_recording=true
enable_transcript=true

# Recording Storage Mode (twilio_only, server_keep_twilio, server_delete_twilio)
storage_mode=server_delete_twilio

# Artifact subfolder to save transcripts and recordings (saved inside voiceAgent/artifacts/)
artifact_subfolder=default

# Campaign workbook files (must be present inside the voiceAgent/input/ folder)
contacts_file=contacts_sheet.xlsx
script_file=script.json
